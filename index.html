<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>PixaMachine — Turn any photo into retro pixel art</title>

    <!-- Link previews (Slack, iMessage, Discord, X). These must live in the raw
         HTML: crawlers do not run the SPA, so nothing may set them from React. -->
    <meta
      name="description"
      content="Turn any photo into iconic retro pixel art. Pick a classic console palette, compare it side by side, and export a crisp PNG — free, in your browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PixaMachine" />
    <meta property="og:url" content="https://pixamachine.quadraticgames.com/" />
    <meta property="og:title" content="PixaMachine — Turn any photo into retro pixel art" />
    <meta
      property="og:description"
      content="Pick a classic console palette, compare it side by side, and export a crisp PNG — free, in your browser."
    />
    <!-- ?v=1 exists to bypass unfurler caches: Slack keys a failed image fetch
         to this exact URL, so the version must change whenever the file does. -->
    <meta property="og:image" content="https://pixamachine.quadraticgames.com/preview.png?v=1" />
    <meta property="og:image:secure_url" content="https://pixamachine.quadraticgames.com/preview.png?v=1" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The PixaMachine logo next to a jellyfish photo compared side by side with its pixel-art version."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PixaMachine — Turn any photo into retro pixel art" />
    <meta
      name="twitter:description"
      content="Pick a classic console palette, compare it side by side, and export a crisp PNG — free, in your browser."
    />
    <meta name="twitter:image" content="https://pixamachine.quadraticgames.com/preview.png?v=1" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
